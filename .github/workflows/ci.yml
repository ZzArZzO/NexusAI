name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Integration tests need a real Postgres: the behaviour under test — pgvector
    # ranking, a generated tsvector column, a trigger spanning two tables — only
    # exists in the database. Mocking Prisma would test the mock.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexusai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexusai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      # The build compiles but never connects; the tests connect but never build.
      SKIP_ENV_VALIDATION: '1'
      TEST_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusai_test?schema=public

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # One database per package. The integration suites truncate every table
      # between tests and turbo runs packages in parallel, so a shared database
      # produces failures that move around between runs.
      - name: Create the per-package test databases
        env:
          PGPASSWORD: nexus
        run: psql -h localhost -U nexus -d nexusai_test -c "CREATE DATABASE nexusai_test_agents"

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexusai_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexusai_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusai_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusai_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexusai_ci_shadow?schema=public

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The seed imports the generated client, which is gitignored.
      - name: Generate Prisma client
        run: pnpm db:generate

      # Only the shadow database is created here. Extensions are installed by the
      # migration itself, which is what makes applying migrations to an empty
      # database sufficient — and what lets the drift check replay history into a
      # freshly reset shadow database.
      - name: Create shadow database
        env:
          PGPASSWORD: nexus
        run: psql -h localhost -U nexus -d nexusai_ci -c "CREATE DATABASE nexusai_ci_shadow"

      - name: Apply migrations to an empty database
        run: pnpm db:migrate:deploy

      - name: Fail if the schema has drifted from its migrations
        run: pnpm db:migrate:check

      - name: Seed
        run: pnpm db:seed

      - name: Seed again — it must be idempotent
        run: pnpm db:seed
