name: nexusai

# Local development stack. Mirrors the managed services this could run on
# (Postgres + pgvector, object storage, durable job engine) so that
# "works locally" means something.
#
# Host ports are deliberately offset from the defaults (55432 rather than 5432,
# and so on) so this stack can run alongside other projects on the same machine
# without a port fight. Container-internal ports stay standard.

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexusai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexusai
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on an empty volume: creates the auxiliary databases before any
      # migration. Extensions are installed by the migration itself.
      - ./sql/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d nexusai']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: nexusai-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage. Stands in for S3; the application only speaks S3's API.
  minio:
    image: minio/minio:latest
    container_name: nexusai-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexussecret
    ports:
      - '59000:9000'
      - '59001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────
  # Inngest, in production mode.
  #
  # `inngest start` rather than `inngest dev`: the dev server keeps state in
  # memory and SQLite, which is not durable enough to build approval gates on. A
  # workflow parked for three days waiting on a human has to survive a restart,
  # or the gate is theatre.
  #
  # It gets its own database on the same Postgres instance, and shares Redis.
  # ─────────────────────────────────────────────────────────────────
  inngest:
    image: inngest/inngest:latest
    container_name: nexusai-inngest
    restart: unless-stopped
    command: ['inngest', 'start']
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-6e657875736169206576656e74206b6579}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-6e6578757361692073696720206b6579aa}
      INNGEST_POSTGRES_URI: postgres://nexus:nexus@postgres:5432/inngest?sslmode=disable
      INNGEST_REDIS_URI: redis://redis:6379
      # Where Inngest finds the application's functions. host.docker.internal
      # resolves to the host from inside the container.
      INNGEST_SDK_URL: http://host.docker.internal:3200/api/inngest
    ports:
      - '58288:8288' # dashboard and API
      - '58289:8289' # connect gateway
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
