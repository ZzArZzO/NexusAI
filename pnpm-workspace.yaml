packages:
  - 'apps/*'
  - 'packages/*'

# Explicit allowlist of packages permitted to run install scripts.
# Each one needs a native binary or engine that cannot ship as plain JS.
allowBuilds:
  '@prisma/engines': true # query/migration engine binaries
  esbuild: true # native bundler binary (used by Vitest)
  prisma: true # CLI post-install
  sharp: true # native image pipeline (Next.js image optimisation)

# Single source of truth for third-party versions across every workspace package.
# Packages reference these with `"dep": "catalog:"` so upgrades happen in one place.
catalog:
  # --- runtime: web ---
  next: 16.2.12
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3

  # --- styling / UI ---
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  tailwind-merge: 3.6.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  lucide-react: 1.27.0
  motion: 12.43.0
  cmdk: 1.1.1
  sonner: 2.0.7
  next-themes: 0.4.6
  recharts: 3.10.1

  # --- data ---
  prisma: 7.9.1
  '@prisma/client': 7.9.1
  '@prisma/adapter-pg': 7.9.1
  '@prisma/config': 7.9.1
  pg: 8.22.0
  '@types/pg': 8.20.0
  better-auth: 1.6.25

  # --- agents / orchestration ---
  ai: 7.0.41
  '@ai-sdk/anthropic': 4.0.23
  '@ai-sdk/openai': 4.0.23
  inngest: 4.13.0

  # --- shared ---
  zod: 4.4.3
  date-fns: 4.4.0
  pino: 10.3.1
  pino-pretty: 13.1.3

  # --- tooling ---
  typescript: 6.0.3
  turbo: 2.10.7
  eslint: 10.8.0
  typescript-eslint: 8.65.0
  '@eslint/js': 10.0.1
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  '@next/eslint-plugin-next': 16.2.12
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10
  '@playwright/test': 1.62.0
  '@testing-library/react': 16.3.2
  '@testing-library/jest-dom': 7.0.0
  jsdom: 30.0.0
  tsup: 8.5.1
  tsx: 4.23.1
  dotenv: 17.4.2
  '@types/node': 26.1.2

minimumReleaseAgeExclude:
  - framer-motion@12.43.0
  - motion-dom@12.43.0
  - motion@12.43.0
